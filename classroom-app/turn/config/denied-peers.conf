# turn/config/denied-peers.conf
#
# Relay targets coturn must never reach. Rendered verbatim into turnserver.conf by bootstrap/render-config.sh.
# Ranges use coturn's "low-high" notation, which every 4.x release accepts.
#
# Why: a TURN server relays packets to any peer a client names. Without this list an authenticated client could
# use the relay to reach the VPC (RFC 1918), the instance metadata service (credentials), the ECS credentials
# endpoint, loopback services on the node, or carrier-grade NAT space. The security group of
# infra/modules/turn-node-pool additionally restricts relay traffic to the SFU prefix list — two independent
# layers, so a mistake in one of them never produces an open relay.
#
# Owner: F8 Real-Time Connectivity (+ security review).

# ---------------------------------------------------------------- IPv4
# "this network" (RFC 1122)
denied-peer-ip=0.0.0.0-0.255.255.255
# private networks (RFC 1918): VPC, peered VPCs, Transit Gateway
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# carrier-grade NAT (RFC 6598)
denied-peer-ip=100.64.0.0-100.127.255.255
# loopback
denied-peer-ip=127.0.0.0-127.255.255.255
# link-local (RFC 3927), includes 169.254.169.254 (EC2 IMDS) and 169.254.170.2 (ECS credentials endpoint)
denied-peer-ip=169.254.0.0-169.254.255.255
# IETF protocol assignments (RFC 6890)
denied-peer-ip=192.0.0.0-192.0.0.255
# documentation (RFC 5737)
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
# benchmarking (RFC 2544)
denied-peer-ip=198.18.0.0-198.19.255.255
# multicast (also blocked by no-multicast-peers), reserved and broadcast
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255

# ---------------------------------------------------------------- IPv6
# loopback. The unspecified address "::" is deliberately NOT listed: coturn compares IPv4 peers against it as a
# wildcard, so "::" or any range starting at "::" denies every IPv4 peer (caught by agent/src/selfProbe.js).
# "::" is never a valid relay target anyway.
denied-peer-ip=::1
# IPv4-mapped (would bypass the IPv4 list)
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
# NAT64 well-known prefix (would reach IPv4 space through a translator)
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
# discard-only (RFC 6666)
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
# documentation (RFC 3849)
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
# 6to4 (would reach embedded IPv4 addresses)
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# unique local (RFC 4193), includes fd00:ec2::254 (IMDS over IPv6)
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# link-local
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# multicast
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff